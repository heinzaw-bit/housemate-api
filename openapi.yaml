          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseEditPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/expenses/{expenseId}/void-preview:
    post:
      summary: Preview the balance effect of voiding an expense
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: expenseId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidDraft' }
      responses:
        '200':
          description: Proposed member balances and a ten-minute preview ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/expenses/{expenseId}/void:
    post:
      summary: Confirm a previously previewed expense void
      description: The creator or a household owner/admin may void. The expense remains visible and immutable with actor, time, and optional reason. Its shares no longer affect balances. Existing settlements remain recorded. Confirmation is idempotent.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: expenseId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidConfirm' }
      responses:
        '200':
          description: Voided expense or original result of an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/expenses/{expenseId}/history:
    get:
      summary: Read an expense's creation, edits, and void history
      description: Any active member of the expense's household may read this history. Changed fields include human-readable old and new values. Events are newest first.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: expenseId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryOffset'
      responses:
        '200':
          description: Paginated expense history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialHistoryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    ChoreId:
      in: path
      name: choreId
      required: true
      schema: { type: string, format: uuid }
    ShoppingItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, format: uuid }
    HouseholdId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    HistoryLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    HistoryOffset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
    InviteToken:
      in: path
      name: token
      required: true
      schema:
        type: string
        description: 43-character base64url bearer token from a shareable invite link.
  securitySchemes:
    schedulerAuth:
      type: http
      scheme: bearer
      description: Private server CRON_SECRET, 32–256 URL-safe characters; never a client/member token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Active member lacks the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Entity absent or outside the caller's household
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict such as an existing membership or locked currency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InviteUnavailable:
      description: Invitation expired, redeemed, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AssistantActionDraft:
      type: object
      required: [kind, householdId, timezone, generatedAt, fields, members, recipientIds, unresolvedFields, notes]
      properties:
        kind: { type: string, enum: [meal, announcement, shopping, chore, expense, bill] }
        householdId: { type: string, format: uuid }
        timezone: { type: string }
        generatedAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            required: [id, displayName]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
        recipientIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        unresolvedFields:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
      oneOf:
        - properties:
            kind: { const: meal }
            fields:
              type: object
              required: [mealType, question, startsAtLocal, responseDeadlineLocal]
              properties:
                mealType: { type: string, enum: [breakfast, lunch, dinner, other] }
                question: { type: string }
                startsAtLocal: { type: string, description: Household local YYYY-MM-DDTHH:mm or empty when unresolved }
                responseDeadlineLocal: { type: string, description: Must be supplied by the member, in household local time }
        - properties:
            kind: { const: announcement }
            fields:
              type: object
              required: [title, body, priority, requiresAcknowledgement, expiresAtLocal]
              properties:
                title: { type: string }
                body: { type: string }
                priority: { type: string, enum: [normal, important, urgent] }
                requiresAcknowledgement: { type: boolean }
                expiresAtLocal: { type: [string, 'null'] }
        - properties:
            kind: { const: shopping }
            fields:
              type: object
              description: Editable unsaved values; empty strings or zero amounts require completion before normal API validation
              required: [title, quantity, unit, note, priority, assignedBuyerMemberId, estimatedPriceMinor]
              properties:
                title: { type: string }
                quantity: { type: [number, 'null'] }
                unit: { type: [string, 'null'] }
                note: { type: [string, 'null'] }
                priority: { type: string }
                assignedBuyerMemberId: { type: [string, 'null'] }
                estimatedPriceMinor: { type: [integer, 'null'] }
        - properties:
            kind: { const: chore }
            fields:
              type: object
              description: Editable unsaved values; empty strings or zero amounts require completion before normal API validation
              required: [title, note, dueAtLocal, assigneeMemberId]
              properties:
                title: { type: string }
                note: { type: [string, 'null'] }
                dueAtLocal: { type: string }
                assigneeMemberId: { type: string }
        - properties:
            kind: { const: expense }
            fields:
              type: object
              description: Editable unsaved values; empty strings or zero amounts require completion before normal API validation
              required: [title, amountMinor, currency, spentOn, payerMemberId, split]
              properties:
                title: { type: string }
                amountMinor: { type: integer }
                currency: { type: string }
                spentOn: { type: string }
                payerMemberId: { type: string }
                split: { $ref: '#/components/schemas/ExpenseSplit' }
        - properties:
            kind: { const: bill }
            fields:
              type: object
              description: Editable unsaved values; empty strings or zero amounts require completion before normal API validation
              required: [title, billType, provider, amountMinor, currency, periodStart, periodEnd, dueDate, payerMemberId, paymentStatus, sharedParticipantIds, adjustments]
              properties:
                title: { type: string }
                billType: { type: string }
                provider: { type: string }
                amountMinor: { type: integer }
                currency: { type: string }
                periodStart: { type: string }
                periodEnd: { type: string }
                dueDate: { type: string }
                payerMemberId: { type: string }
                paymentStatus: { type: string }
                sharedParticipantIds: { type: array, items: { type: string, format: uuid } }
                adjustments: { type: array, items: { $ref: '#/components/schemas/BillAdjustment' } }
    NotificationPage:
      type: object
      required: [notifications, unreadCount, nextCursor]
      properties:
        notifications:
          type: array
          items:
            type: object
            required: [id, householdId, category, priority, entityType, entityId, title, body, createdAt, readAt, href]
            properties:
              id: { type: string, format: uuid }
              householdId: { type: string, format: uuid }
              category: { type: string, enum: [money, bills, settlements, meals, chores, shopping, events, announcements, polls] }
              priority: { type: string, enum: [low, normal, important, urgent] }
              entityType: { type: string, enum: [expense, bill, settlement, meal, chore, shopping, event, announcement, poll] }
              entityId: { type: string, format: uuid }
              title: { type: string }
              body: { type: string }
              createdAt: { type: string, format: date-time }
              readAt: { type: [string, 'null'], format: date-time }
              href: { type: string, description: Relative API-generated web link; the destination checks current access. }
        unreadCount: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
    NotificationChannels:
      type: object
      additionalProperties: false
      required: [inApp, webPush]
      properties:
        inApp: { type: boolean }
        webPush: { type: boolean }
    NotificationPreferenceInput:
      type: object
      additionalProperties: false
      required: [categories, quietHours]
      properties:
        categories:
          type: object
          additionalProperties: false
          required: [money, bills, settlements, meals, chores, shopping, events, announcements, polls]
          properties:
            money: { $ref: '#/components/schemas/NotificationChannels' }
            bills: { $ref: '#/components/schemas/NotificationChannels' }
            settlements: { $ref: '#/components/schemas/NotificationChannels' }
            meals: { $ref: '#/components/schemas/NotificationChannels' }
            chores: { $ref: '#/components/schemas/NotificationChannels' }
            shopping: { $ref: '#/components/schemas/NotificationChannels' }
            events: { $ref: '#/components/schemas/NotificationChannels' }
            announcements: { $ref: '#/components/schemas/NotificationChannels' }
            polls: { $ref: '#/components/schemas/NotificationChannels' }
        quietHours:
          type: object
          additionalProperties: false
          required: [enabled, start, end]
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
            end: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    NotificationPreferences:
      type: object
      required: [categories, quietHours, timezone]
      properties:
        categories: { $ref: '#/components/schemas/NotificationPreferenceInput/properties/categories' }
        quietHours: { $ref: '#/components/schemas/NotificationPreferenceInput/properties/quietHours' }
        timezone: { type: string }
    PushRegistration:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        refreshOnly: { type: boolean, default: false, description: True for silent refresh; never registers a new device or re-enables a disabled one. }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 80, maxLength: 100 }
            auth: { type: string, minLength: 20, maxLength: 30 }
    PushDevice:
      type: object
      required: [id, enabled, createdAt, lastSentAt, lastError]
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSentAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'], description: Sanitized status code only, never endpoint or provider response body. }
    AnnouncementDraft:
      type: object
      additionalProperties: false
      required: [title, body, priority, requiresAcknowledgement, recipientIds, idempotencyKey]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        priority: { type: string, enum: [normal, important, urgent] }
        requiresAcknowledgement: { type: boolean }
        recipientIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        expiresAtLocal: { type: [string, 'null'], description: 'Optional future YYYY-MM-DDTHH:mm in the household timezone' }
        idempotencyKey: { type: string, format: uuid }
    Announcement:
      type: object
      required: [id, householdId, title, body, priority, requiresAcknowledgement, expiresAt, timezone, publishedAt, authorDisplayName, viewerMemberId, recipients, counts, expired, canAcknowledge]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        priority: { type: string, enum: [normal, important, urgent] }
        requiresAcknowledgement: { type: boolean }
        expiresAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        publishedAt: { type: string, format: date-time }
        authorDisplayName: { type: string }
        viewerMemberId: { type: string, format: uuid }
        recipients:
          type: array
          items:
            type: object
            required: [memberId, displayName, active, acknowledgedAt]
            properties:
              memberId: { type: string, format: uuid }
              displayName: { type: string }
              active: { type: boolean }
              acknowledgedAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [total, acknowledged, awaiting]
          properties:
            total: { type: integer, minimum: 1 }
            acknowledged: { type: integer, minimum: 0 }
            awaiting: { type: integer, minimum: 0, description: Active recipients who have not acknowledged; zero when acknowledgement is not requested }
        expired: { type: boolean }
        canAcknowledge: { type: boolean }
    PollDraft:
      type: object
      additionalProperties: false
      required: [question, options, allowMultiple, deadlineLocal, voterIds, idempotencyKey]
      properties:
        question: { type: string, minLength: 1, maxLength: 240 }
        options:
          type: array
          minItems: 2
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 100 }
        allowMultiple: { type: boolean }
        deadlineLocal: { type: string, description: 'Future YYYY-MM-DDTHH:mm in household timezone' }
        voterIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
    Poll:
      type: object
      required: [id, householdId, question, allowMultiple, deadline, timezone, createdAt, authorDisplayName, viewerMemberId, options, voterCount, activeVoterCount, responseCount, myOptionIds, canVote, closed]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        question: { type: string }
        allowMultiple: { type: boolean }
        deadline: { type: string, format: date-time }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        authorDisplayName: { type: string }
        viewerMemberId: { type: string, format: uuid }
        options:
          type: array
          items:
            type: object
            required: [id, label, position, voteCount]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              position: { type: integer, minimum: 0 }
              voteCount: { type: integer, minimum: 0 }
        voterCount: { type: integer, minimum: 1, description: Number of selected voters at publication }
        activeVoterCount: { type: integer, minimum: 0 }
        responseCount: { type: integer, minimum: 0, description: Distinct voters with at least one saved selection, including former members }
        myOptionIds:
          type: array
          items: { type: string, format: uuid }
        canVote: { type: boolean }
        closed: { type: boolean }
    EventDraft:
      type: object
      additionalProperties: false
      required: [title, startsAtLocal, idempotencyKey]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 160 }
        startsAtLocal: { type: string, description: 'YYYY-MM-DDTHH:mm in household timezone; must be in the future' }
        endsAtLocal: { type: [string, 'null'], description: 'Optional YYYY-MM-DDTHH:mm in household timezone; after start' }
        idempotencyKey: { type: string, format: uuid }
    Event:
      type: object
      required: [id, householdId, title, description, location, startsAt, endsAt, timezone, createdAt, creatorDisplayName, viewerMemberId, attendees, counts, canRespond]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        creatorDisplayName: { type: string }
        viewerMemberId: { type: string, format: uuid }
        attendees:
          type: array
          items:
            type: object
            required: [memberId, displayName, response, respondedAt]
            properties:
              memberId: { type: string, format: uuid }
              displayName: { type: string }
              response: { type: [string, 'null'], enum: [going, maybe, not_going, null] }
              respondedAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [going, maybe, notGoing, awaiting]
          properties:
            going: { type: integer, minimum: 0 }
            maybe: { type: integer, minimum: 0 }
            notGoing: { type: integer, minimum: 0 }
            awaiting: { type: integer, minimum: 0 }
        canRespond: { type: boolean }
    ChoreCreate:
      type: object
      additionalProperties: false
      required: [title, note, dueAtLocal, assigneeMemberId]
      properties:
        idempotencyKey: { type: string, format: uuid, description: Optional durable confirmation key; different payload returns 409; identical retry returns current saved record }
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: [string, 'null'], maxLength: 500 }
        dueAtLocal: { type: string, description: 'YYYY-MM-DDTHH:mm in household timezone' }
        assigneeMemberId: { type: string, format: uuid }
    ChoreDraft:
      type: object
      additionalProperties: false
      required: [title, note, dueAtLocal, assigneeMemberId]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: [string, 'null'], maxLength: 500 }
        dueAtLocal: { type: string, description: 'YYYY-MM-DDTHH:mm in household timezone' }
        assigneeMemberId: { type: string, format: uuid }
    ChoreRevision:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    Chore:
      type: object
      required: [id, householdId, title, note, dueAt, timezone, assigneeMemberId, assigneeDisplayName, status, skipReason, closedAt, closedByDisplayName, createdByDisplayName, createdAt, updatedAt, revision, viewerMemberId, canManage, canComplete, canRequestSwap, pendingSwap]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        title: { type: string }
        note: { type: [string, 'null'] }
        dueAt: { type: string, format: date-time }
        timezone: { type: string }
        assigneeMemberId: { type: string, format: uuid }
        assigneeDisplayName: { type: string }
        status: { type: string, enum: [open, completed, skipped] }
        skipReason: { type: [string, 'null'] }
        closedAt: { type: [string, 'null'], format: date-time }
        closedByDisplayName: { type: [string, 'null'] }
        createdByDisplayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revision: { type: integer }
        viewerMemberId: { type: string, format: uuid }
        canManage: { type: boolean }
        canComplete: { type: boolean }
        canRequestSwap: { type: boolean }
        pendingSwap:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, requestedByMemberId, requestedByDisplayName, targetMemberId, targetDisplayName, createdAt, canRespond]
              properties:
                id: { type: string, format: uuid }
                requestedByMemberId: { type: string, format: uuid }
                requestedByDisplayName: { type: string }
                targetMemberId: { type: string, format: uuid }
                targetDisplayName: { type: string }
                createdAt: { type: string, format: date-time }
                canRespond: { type: boolean }
    ShoppingCreate:
      type: object
      required: [title, quantity, unit, note, priority, assignedBuyerMemberId, estimatedPriceMinor]
      properties:
        idempotencyKey: { type: string, format: uuid, description: Optional durable confirmation key; different payload returns 409; identical retry returns current saved record }
        title: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: [number, 'null'], minimum: 0.001, maximum: 999999999, description: 'At most three decimal places' }
        unit: { type: [string, 'null'], maxLength: 40 }
        note: { type: [string, 'null'], maxLength: 500 }
        priority: { type: string, enum: [low, normal, high] }
        assignedBuyerMemberId: { type: [string, 'null'], format: uuid }
        estimatedPriceMinor: { type: [integer, 'null'], minimum: 0, maximum: 999999999999 }
    ShoppingDraft:
      type: object
      required: [title, quantity, unit, note, priority, assignedBuyerMemberId, estimatedPriceMinor]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: [number, 'null'], minimum: 0.001, maximum: 999999999, description: 'At most three decimal places' }
        unit: { type: [string, 'null'], maxLength: 40 }
        note: { type: [string, 'null'], maxLength: 500 }
        priority: { type: string, enum: [low, normal, high] }
        assignedBuyerMemberId: { type: [string, 'null'], format: uuid }
        estimatedPriceMinor: { type: [integer, 'null'], minimum: 0, maximum: 999999999999 }
    ShoppingRevision:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    ShoppingItem:
      allOf:
        - { $ref: '#/components/schemas/ShoppingDraft' }
        - type: object
          required: [id, householdId, currency, status, assignedBuyerDisplayName, purchasedPriceMinor, purchasedByDisplayName, purchasedAt, cancelledAt, linkedExpenseId, linkedExpenseVoidedAt, createdByDisplayName, createdAt, updatedAt, revision, viewerMemberId]
          properties:
            id: { type: string, format: uuid }
            householdId: { type: string, format: uuid }
            currency: { type: string, enum: [USD, THB] }
            status: { type: string, enum: [needed, assigned, purchased, cancelled] }
            assignedBuyerDisplayName: { type: [string, 'null'] }
            purchasedPriceMinor: { type: [integer, 'null'], minimum: 0 }
            purchasedByDisplayName: { type: [string, 'null'] }
            purchasedAt: { type: [string, 'null'], format: date-time }
            cancelledAt: { type: [string, 'null'], format: date-time }
            linkedExpenseId: { type: [string, 'null'], format: uuid }
            linkedExpenseVoidedAt: { type: [string, 'null'], format: date-time }
            createdByDisplayName: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            revision: { type: integer, minimum: 1 }
            viewerMemberId: { type: string, format: uuid }
    MealRole:
      type: object
      additionalProperties: false
      required: [memberId, role]
      properties:
        memberId: { type: string, format: uuid }
        role: { type: string, minLength: 1, maxLength: 60 }
    MealDraft:
      type: object
      additionalProperties: false
      required: [mealType, question, startsAtLocal, responseDeadlineLocal, participantIds, cookingRoles, idempotencyKey]
      properties:
        mealType: { type: string, enum: [breakfast, lunch, dinner, other] }
        question: { type: string, minLength: 1, maxLength: 240 }
        startsAtLocal: { type: string, description: 'YYYY-MM-DDTHH:mm in household timezone' }
        responseDeadlineLocal: { type: string, description: 'YYYY-MM-DDTHH:mm in household timezone; future and before meal' }
        participantIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        cookingRoles:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MealRole' }
        idempotencyKey: { type: string, format: uuid }
    Meal:
      type: object
      required: [id, householdId, mealType, question, startsAt, responseDeadline, timezone, createdAt, creatorDisplayName, viewerMemberId, participants, counts, cookingRoles, canRespond]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        mealType: { type: string, enum: [breakfast, lunch, dinner, other] }
        question: { type: string }
        startsAt: { type: string, format: date-time }
        responseDeadline: { type: string, format: date-time }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        creatorDisplayName: { type: string }
        viewerMemberId: { type: string, format: uuid }
        participants:
          type: array
          items:
            type: object
            required: [memberId, displayName, response, respondedAt]
            properties:
              memberId: { type: string, format: uuid }
              displayName: { type: string }
              response: { type: [string, 'null'], enum: [joining, not_joining, maybe, null] }
              respondedAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [joining, notJoining, maybe, awaiting]
          properties:
            joining: { type: integer, minimum: 0 }
            notJoining: { type: integer, minimum: 0 }
            maybe: { type: integer, minimum: 0 }
            awaiting: { type: integer, minimum: 0 }
        cookingRoles:
          type: array
          items:
            type: object
            required: [memberId, role, displayName]
            properties:
              memberId: { type: string, format: uuid }
              role: { type: string }
              displayName: { type: string }
        canRespond: { type: boolean }
    Dashboard:
      type: object
      required: [householdId, generatedAt, timezone, today, dueSoonDays, balance, pendingBills, nextMeal, shoppingOpenCount, chores, recentActivity]
      properties:
        householdId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string }
        today: { type: string, format: date }
        dueSoonDays: { type: integer, const: 7 }
        shoppingOpenCount: { type: integer, minimum: 0 }
        chores:
          type: object
          required: [openCount, overdueCount, nextDue]
          properties:
            openCount: { type: integer, minimum: 0 }
            overdueCount: { type: integer, minimum: 0 }
            nextDue:
              anyOf:
                - type: 'null'
                - type: object
                  required: [id, title, dueAt, assigneeDisplayName]
                  properties:
                    id: { type: string, format: uuid }
                    title: { type: string }
                    dueAt: { type: string, format: date-time }
                    assigneeDisplayName: { type: string }
        nextMeal:
          anyOf:
            - type: 'null'
            - type: object
              required: [id, mealType, question, startsAt, responseDeadline, joiningCount, awaitingCount]
              properties:
                id: { type: string, format: uuid }
                mealType: { type: string, enum: [breakfast, lunch, dinner, other] }
                question: { type: string }
                startsAt: { type: string, format: date-time }
                responseDeadline: { type: string, format: date-time }
                joiningCount: { type: integer, minimum: 0 }
                awaitingCount: { type: integer, minimum: 0 }
        balance:
          $ref: '#/components/schemas/BalanceSummary'
        pendingBills:
          type: object
          required: [overdueCount, dueSoonCount, items, hasMore]
          properties:
            overdueCount: { type: integer, minimum: 0 }
            dueSoonCount: { type: integer, minimum: 0 }
            hasMore: { type: boolean }
            items:
              type: array
              maxItems: 5
              items:
                type: object
                required: [id, title, provider, dueDate, amountMinor, urgency]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  provider: { type: string }
                  dueDate: { type: string, format: date }
                  amountMinor: { type: integer, minimum: 1 }
                  urgency: { type: string, enum: [overdue, due_soon, upcoming] }
        recentActivity:
          type: array
          maxItems: 10
          description: Latest ten financial events, newest first with a stable ID tie-break. Titles describe the current record; record history contains prior values.
          items:
            type: object
            required: [id, resourceType, resourceId, kind, title, occurredAt, actorDisplayName]
            properties:
              id: { type: string }
              resourceType: { type: string, enum: [expense, bill, settlement] }
              resourceId: { type: string, format: uuid }
              kind: { type: string, enum: [created, edited, voided, paid, unpaid, recorded] }
              title: { type: string }
              occurredAt: { type: string, format: date-time }
              actorDisplayName: { type: string }
    HouseActions:
      type: object
      required: [householdId, generatedAt, mealResponses, swapRequests, chores, shopping, announcements, polls]
      properties:
        householdId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        mealResponses:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, title, startsAt, responseDeadline]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              responseDeadline: { type: string, format: date-time }
        swapRequests:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, title, dueAt]
            properties:
