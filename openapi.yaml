openapi: 3.1.0
info:
  title: HouseMate API
  version: 0.1.0
  description: Household identity, membership, money, daily life, events, announcements, polls, personal notifications, preferences, and web push API for web and mobile clients.
servers:
  - url: http://localhost:3001
security:
  - bearerAuth: []
paths:
  /v1/households/{id}/search:
    get:
      summary: Search records visible to the active household member
      description: Read-only case-insensitive literal substring search across expense titles, bill titles/providers, transfer participant names/method/notes, meal questions/types, chore titles/notes, shopping titles/notes/units, event titles/descriptions/locations, announcement titles/bodies and poll questions/options. No regex, wildcard operators, relevance ranking, user email search, draft/history-event search or AI provider calls. All saved states (including voided financial records, closed chores, past meals/events and expired communications) are searchable and labeled. Household membership and targeted announcement/poll audience rules match detail reads. Newest creation/publication first, then type and ID descending. Cursor retains PostgreSQL microseconds and is bound to verified caller, household, normalized query and type; this is a live read, not a frozen snapshot across pages. Private queries/results must not be cached or logged. No counts from inaccessible records are returned.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
          description: Trimmed literal text; 2–120 characters, with no NUL characters
        - name: type
          in: query
          schema: { type: string, enum: [all, expense, bill, settlement, meal, chore, shopping, event, announcement, poll], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
          description: Opaque continuation for the same query, type, caller and household
      responses:
        '200':
          description: No-store page of authorized saved records
          content:
            application/json:
              schema:
                type: object
                required: [results, nextCursor]
                properties:
                  results:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, type, title, snippet, status, createdAt, href]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string, enum: [expense, bill, settlement, meal, chore, shopping, event, announcement, poll] }
                        title: { type: string, maxLength: 240 }
                        snippet: { type: string, maxLength: 180 }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
                        href: { type: string, description: Relative path to the normal authorized record view }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Search exceeded its bounded database time limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/households/{id}/assistant:
    get:
      summary: Read assistant availability for an active household member
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: No-store availability; quick questions work independently of AI configuration
          content:
            application/json:
              schema:
                type: object
                required: [naturalLanguageEnabled, actionDraftsEnabled, provider, requiresPrivacyAcknowledgement]
                properties:
                  naturalLanguageEnabled: { type: boolean }
                  actionDraftsEnabled: { type: boolean, description: Local drafts are independent of Gemini configuration; supportedDraftKinds identifies available action kinds }
                  supportedDraftKinds: { type: array, items: { type: string, enum: [meal, announcement, shopping, chore, expense, bill] } }
                  provider: { type: [string, 'null'], enum: [gemini, null] }
                  requiresPrivacyAcknowledgement: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/assistant/drafts:
    post:
      summary: Prepare a local meal-check or announcement draft without publishing
      description: Authorized active household members only. Common English meal, announcement, shopping, chore, expense and bill commands are interpreted inside HouseMate; the message and member details never go to Gemini, consume model quota, or create records. Unclear times/deadlines/audiences require editing. Drafts are returned to the client and are not persisted. Missing or ambiguous fields require explicit editing. Money drafts never contain AI-calculated shares; the client must obtain the existing expense/bill API preview before confirmation. New clients opt into additional kinds with allowedKinds; omitted allowedKinds preserves meal/announcement-only replies for older clients. Shopping/chore confirmation uses optional durable idempotency keys on normal creation endpoints after the additive action-create migration; their saved creator/time/key/hash record is the execution trace. Null draft means a read-only question or unrecognized non-action syntax; recognized unsupported, negated or multiple action commands return 400 and must never fall back to Gemini; no provider fallback occurs here. The client reviews and explicitly confirms through the normal meals, announcements, shopping, chores, expenses or bills POST endpoint, whose membership, audience, time and content validations remain authoritative. Notifications are generated only by a successful publication. Private input/output must not be cached or logged.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
                allowedKinds: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { type: string, enum: [meal, announcement, shopping, chore, expense, bill] }, description: Defaults to meal and announcement for backward compatibility }
      responses:
        '200':
          description: No-store unsaved draft with fields requiring clarification, or null
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft:
                    anyOf:
                      - $ref: '#/components/schemas/AssistantActionDraft'
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Assistant service unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/households/{id}/assistant/questions:
    post:
      summary: Answer a read-only household question from authorized API services
      description: Choose a quick topic OR send a general question (1–1000 characters). Gemini free-tier classification requires server-only configuration and privacyAcknowledged true. The member acknowledges Google's unpaid-tier data use and that the question contains no personal/confidential information. The API rejects recognized active member names/emails, digits, links and credential markers before provider use; this guard is not a comprehensive personal-data detector. Named member questions belong in Money. Recognized action commands receive local clarification without provider use. Only the general question is sent; no household records, member lists, financial results or conversation history are sent or saved by HouseMate. The model only classifies intent; the API generates answers and amounts. No household records are mutated. Durable limits are 20 attempts per account per UTC hour and 200 globally per UTC day. Upstream limits fail without retry or paid fallback. Private answers are never cached. Bounded lists disclose truncation. Bills report provider status, not individual member payments.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topic: { type: string, enum: [summary, balance, bills, meals, chores, shopping, events] }
                message: { type: string, minLength: 1, maxLength: 1000 }
                privacyAcknowledged: { type: boolean, const: true, description: Required before any free-text question is sent to Gemini }
              oneOf:
                - { required: [topic], not: { required: [message] } }
                - { required: [message], not: { required: [topic] } }
      responses:
        '200':
          description: API-generated answer or clarification with authorized source links
          content:
            application/json:
              schema:
                type: object
                required: [kind, topic, text, generatedAt, timezone, rows, sources, partial]
                properties:
                  kind: { type: string, enum: [answer, clarification] }
                  topic: { type: string, enum: [summary, balance, bills, meals, chores, shopping, events, unsupported] }
                  text: { type: string }
                  generatedAt: { type: string, format: date-time }
                  timezone: { type: string }
                  partial: { type: boolean }
                  rows:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [label, detail, href]
                      properties:
                        label: { type: string }
                        detail: { type: string }
                        href: { type: string, description: Same-app source path including household selector }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [label, href]
                      properties:
                        label: { type: string }
                        href: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: AI_LIMIT_REACHED (local budget) or AI_PROVIDER_LIMIT_REACHED (Gemini quota). Failed attempts consume a local slot; requests are never automatically retried. Quick topics stay available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: ASSISTANT_UNAVAILABLE or ASSISTANT_SETUP_REQUIRED; quick questions and manual household flows remain available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /internal/notifications/run:
    get:
      summary: Run one notification reminder and delivery batch
      description: Server scheduler only. Requires the API's private CRON_SECRET as a Bearer credential, not a member JWT. Generates reminders using existing recipient rules and processes the existing leased delivery queue. The response contains no household data. Missing configuration or invalid credentials fail closed. Calls never run migrations. Repeated runs use deterministic reminder keys and atomic delivery leases; provider delivery is not exactly once.
      security:
        - schedulerAuth: []
      responses:
        '200':
          description: Batch completed; includes Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503':
          description: JOB_BUSY with Retry-After 60 for an overlapping run on the same instance, or JOB_FAILED for a sanitized worker error. Scheduler may retry later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/households/{id}/notifications:
    get:
      summary: Read the caller's personal notification feed
      description: Active membership required. Newest first with a stable cursor. Only the caller's in-app notifications are returned, including previously read history. No private response is cached.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { in: query, name: scope, schema: { type: string, enum: [all, unread], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 500 } }
      responses:
        '200':
          description: Personal feed and total unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/notifications/{notificationId}/read:
    put:
      summary: Mark the caller's notification read idempotently
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Read timestamp retained on repeat requests }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/notifications/read-all:
    post:
      summary: Mark all the caller's notifications through the displayed newest item read
      description: The boundary must belong to the caller in this household. Entries chronologically newer than that item stay unread.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [throughId], additionalProperties: false, properties: { throughId: { type: string, format: uuid } } }
      responses:
        '204': { description: Existing items marked read }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/notification-preferences:
    get:
      summary: Read the caller's notification preferences for this household
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Category channels, quiet hours, and current household timezone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Replace the caller's household notification preferences
      description: In-app defaults on. Push categories default on except shopping, but no device receives push before explicit opt-in. Quiet hours default disabled with 23:00–07:00 suggested times. All priorities respect quiet hours; there is no urgent bypass. Historical inbox entries are retained. Push preferences are rechecked at delivery.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferenceInput' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/push-config:
    get:
      summary: Read public web push availability after sign-in
      responses:
        '200':
          description: Public VAPID key only; private key and contact are never returned
          content:
            application/json:
              schema:
                type: object
                required: [enabled, publicKey, reason]
                properties:
                  enabled: { type: boolean }
                  publicKey: { type: [string, 'null'] }
                  reason: { type: [string, 'null'], enum: [server_setup, null] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/push-subscriptions:
    get:
      summary: List only the caller's push devices without exposing endpoint or encryption keys
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema: { type: object, required: [devices], properties: { devices: { type: array, items: { $ref: '#/components/schemas/PushDevice' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Register or refresh the caller's browser push subscription
      description: Explicit browser opt-in required. Only supported HTTPS browser push endpoints and valid encryption keys are accepted. A subscription is bound to one account and cannot be claimed by another. Repeated registration refreshes the same device. New devices receive only subsequent notifications, not the old inbox. Maximum ten active devices per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRegistration' }
      responses:
        '200':
          description: Registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Web push server setup incomplete }
  /v1/push-subscriptions/{subscriptionId}:
    delete:
      summary: Disable only the caller's push device
      description: Soft disable is idempotent. Pending deliveries are skipped. Clients also unsubscribe the local browser subscription when disabling this browser or signing out.
      parameters:
        - { in: path, name: subscriptionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Device disabled }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/announcements:
    get:
      summary: List announcements visible to the caller
      description: Active recipients, the author, and household owners/admins can read. All lists are paginated; all includes expired records, ordered active first, then priority and newest publication.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: scope
          schema: { type: string, enum: [all, needs_ack, expired], default: all }
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryOffset'
      responses:
        '200':
          description: Visible announcements
          content:
            application/json:
              schema:
                type: object
                required: [announcements]
                properties:
                  announcements: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Publish an announcement to selected active members
      description: Any active member may publish. Recipients are fixed at publication. Creation is idempotent for the same normalized draft and retry key.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementDraft' }
      responses:
        '201':
          description: Published announcement or original result of an identical retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/announcements/{announcementId}:
    get:
      summary: Read an announcement and recipient acknowledgement state
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: announcementId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible announcement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/announcements/{announcementId}/acknowledgement:
    put:
      summary: Acknowledge as the caller
      description: Only an active selected recipient can acknowledge. Acknowledgement is permanent and safe to repeat; new acknowledgements close at optional expiry. Published content cannot be edited in this release.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: announcementId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Announcement with acknowledgement recorded once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/polls:
    get:
      summary: List polls visible to the caller
      description: Active selected voters, the author, and owners/admins can read aggregate results. Open polls are ordered by earliest deadline; closed polls by latest deadline.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: scope
          schema: { type: string, enum: [open, needs_vote, closed], default: open }
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryOffset'
      responses:
        '200':
          description: Visible polls
          content:
            application/json:
              schema:
                type: object
                required: [polls]
                properties:
                  polls: { type: array, items: { $ref: '#/components/schemas/Poll' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Publish a single or multiple choice poll
      description: Any active household member may publish. Options and voter eligibility are fixed at publication. Deadline is entered in the household timezone and must be in the future. Creation is idempotent.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollDraft' }
      responses:
        '201':
          description: Published poll or original result of an identical retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/polls/{pollId}:
    get:
      summary: Read a poll, aggregate results, and the caller's selections
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: pollId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible poll
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/polls/{pollId}/vote:
    put:
      summary: Replace the caller's complete selection atomically
      description: Only active eligible voters may vote before the deadline. Single choice requires at most one option. Duplicate or foreign option IDs are rejected. An empty selection withdraws the caller's vote. Repeating the same selection never adds another vote. Existing votes remain counted if a voter later leaves the household.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: pollId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [optionIds]
              properties:
                optionIds:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Poll with updated results and caller selection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/events:
    get:
      summary: List household events and attendance
      description: Active household members may list upcoming or past events. Attendance includes currently active members only.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: scope
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryOffset'
      responses:
        '200':
          description: Events in the selected scope
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a household event
      description: Any active household member may create a future event. The idempotency key identifies retries of the same draft.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDraft' }
      responses:
        '201':
          description: Created event or original result of an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/events/{eventId}:
    get:
      summary: Read an event and current attendance
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/events/{eventId}/attendance:
    patch:
      summary: Set the caller's attendance response
      description: An active member may change only their own response until the event starts.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, enum: [going, maybe, not_going] }
      responses:
        '200':
          description: Event with updated attendance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200':
          description: API process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /health/ready:
    get:
      security: []
      summary: Database readiness check
      description: Public bounded SELECT 1 check. No household reads, credentials or dependency details are returned. Cache-Control is no-store.
      responses:
        '200':
          description: API can query its database
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '503':
          description: Database unavailable or readiness unconfigured
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }
  /v1/households/{id}/dashboard:
    get:
      summary: Read the household home dashboard from a consistent snapshot
      description: Active members only. Balances exclude voids and Unpaid bills. Pending bills exclude voids and are ordered by earliest due date. Urgency uses the household timezone; due soon includes today through seven days ahead. Activity includes financial creation, edits, voids, provider-status changes, and reported transfers. The next upcoming meal, open shopping item count, and open chore summary are included.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fresh dashboard snapshot; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/households/{id}/house-actions:
    get:
      summary: Read the current member's next household actions
      description: Active members only. Returns up to three items per category for unanswered meal checks, pending chore swaps, assigned open chores and shopping, targeted unexpired announcements needing acknowledgement, and eligible open polls without a saved vote. Each category is ordered by its most relevant deadline or priority. This is a preview, not a complete list.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fresh personal house action preview; Cache-Control is no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseActions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/chores:
    get:
      summary: List household chores, open first by due time
      description: Active household members only. Due times are instants; clients classify upcoming and overdue using the household timezone. Supports limit (1–100, default 50) and offset (default 0). Cache-Control is no-store.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Chores
          content:
            application/json:
              schema:
                type: object
                required: [chores]
                properties:
                  chores: { type: array, items: { $ref: '#/components/schemas/Chore' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a one-off chore for an active member
      description: Any active member can create. dueAtLocal is interpreted in the household timezone and must be in the future.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoreCreate' }
      responses:
        '201':
          description: Created chore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/chores/{choreId}:
    get:
      summary: Read one household chore
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
      responses:
        '200':
          description: Chore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/chores/{choreId}/assignment:
    patch:
      summary: Reassign an open chore
      description: Owner or admin only. Cancels any pending swap request.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assigneeMemberId, expectedRevision]
              properties:
                assigneeMemberId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated chore, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/chores/{choreId}/complete:
    post:
      summary: Complete an open chore
      description: Assignee or owner/admin. Cancels any pending swap request.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoreRevision' }
      responses:
        '200': { description: Completed chore, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/chores/{choreId}/skip:
    post:
      summary: Skip an open chore with a reason
      description: Assignee or owner/admin. Cancels any pending swap request.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, reason]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Skipped chore, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/chores/{choreId}/swap-requests:
    post:
      summary: Ask another active member to take an open chore
      description: Only the current assignee can request a swap. One request may be pending at a time.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, targetMemberId]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                targetMemberId: { type: string, format: uuid }
      responses:
        '201': { description: Chore with pending swap, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/chores/{choreId}/swap-requests/{swapId}/response:
    post:
      summary: Accept or decline a swap request
      description: Only the requested active member can respond. Accepting atomically assigns the chore to them.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/ChoreId' }
        - { in: path, name: swapId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, decision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                decision: { type: string, enum: [accepted, declined] }
      responses:
        '200': { description: Chore after swap response, content: { application/json: { schema: { $ref: '#/components/schemas/Chore' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/meals:
    get:
      summary: List household meal checks with optional status scope
      description: Active members only. Scope all (default) orders upcoming first, then most recent past checks; reply returns checks awaiting the caller's response before their deadline. Results are paginated, up to 50 per request.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - { in: query, name: scope, schema: { type: string, enum: [all, reply, upcoming, past], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Active household member's meal checks
          content:
            application/json:
              schema:
                type: object
                required: [meals]
                properties:
                  meals: { type: array, items: { $ref: '#/components/schemas/Meal' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a meal check
      description: Any active member can create a meal check. Local date and time values use the household timezone. Repeating the same idempotency key with the same content returns the existing meal.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealDraft' }
      responses:
        '201':
          description: Created or repeated meal check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/meals/{mealId}:
    get:
      summary: Read a meal check
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: mealId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Meal check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/meals/{mealId}/response:
    patch:
      summary: Answer or change the caller's meal response before the deadline
      description: The caller must be an active household member selected for this meal. Answers lock at the deadline.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: mealId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response]
              properties:
                response: { type: string, enum: [joining, not_joining, maybe] }
      responses:
        '200':
          description: Updated meal check and counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/meals/{mealId}/cooking-roles:
    put:
      summary: Replace cooking role assignments
      description: Any active household member may assign selected active participants to custom cooking roles.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: mealId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cookingRoles]
              properties:
                cookingRoles:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/MealRole' }
      responses:
        '200':
          description: Meal check with updated roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/shopping-items:
    get:
      summary: List household shopping items
      description: Active members only. Open items first, then purchased and cancelled items. Each page contains up to 100 items.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Shopping items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShoppingItem' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add a shopping item
      description: Any active member may add an item. A selected buyer must be an active member of the same household.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingCreate' }
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/shopping-items/{itemId}:
    get:
      summary: Read a shopping item
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ShoppingItemId'
      responses:
        '200':
          description: Shopping item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit an open shopping item, including its optional buyer
      description: Any active member may edit. Purchased and cancelled items cannot be edited. A stale revision returns 409.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ShoppingItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ShoppingDraft' }
                - type: object
                  required: [expectedRevision]
                  properties:
                    expectedRevision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/shopping-items/{itemId}/cancel:
    post:
      summary: Cancel an open shopping item
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ShoppingItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingRevision' }
      responses:
        '200':
          description: Cancelled item, retained in history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/shopping-items/{itemId}/purchase:
    post:
      summary: Mark an open item purchased without creating an expense
      description: Optional actual price uses integer minor units in the household currency. This does not affect balances.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ShoppingItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, purchasedPriceMinor]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                purchasedPriceMinor: { type: [integer, 'null'], minimum: 0, maximum: 999999999999 }
      responses:
        '200':
          description: Purchased item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/shopping-items/{itemId}/purchase-with-expense:
    post:
      summary: Confirm an expense and mark its shopping item purchased atomically
      description: Use the normal expense preview endpoint before calling this endpoint. The expense title must start with 'Shopping:' followed by the item's current title, truncated to fit the expense title limit. The API recalculates shares, confirms the expense idempotently, and updates the item in one transaction. Retrying the same key and draft returns the linked expense.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ShoppingItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, expenseDraft, idempotencyKey]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                expenseDraft: { $ref: '#/components/schemas/ExpenseDraft' }
                idempotencyKey: { type: string, format: uuid }
      responses:
        '200':
          description: Purchased item and confirmed expense
          content:
            application/json:
              schema:
                type: object
                required: [item, expense]
                properties:
                  item: { $ref: '#/components/schemas/ShoppingItem' }
                  expense: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/me:
    get:
      summary: Get the authenticated identity
      responses:
        '200':
          description: Identity from Supabase Auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      summary: Update the caller's HouseMate display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/households:
    get:
      summary: List active households for the caller
      responses:
        '200':
          description: Household memberships
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items:
                      $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Create a household and its owner membership atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, currency, timezone]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                currency:
                  type: string
                  enum: [USD, THB]
                timezone:
                  type: string
                  description: IANA timezone, such as Asia/Bangkok.
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/households/{id}:
    get:
      summary: Get a household when the caller is an active member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Household details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Household absent or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Edit household settings as owner or admin; only the owner may change currency before financial activity
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                timezone:
                  type: string
                  description: IANA timezone.
                currency:
                  type: string
                  enum: [USD, THB]
      responses:
        '200':
          description: Updated household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/households/{id}/members:
    get:
      summary: List active household members for an active member
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Members and their roles
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/households/{id}/members/{memberId}:
    patch:
      summary: Promote or demote a member as household owner; owner role cannot change here
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/households/{id}/invites:
    get:
      summary: List recent invitation status for owners and admins; tokens cannot be retrieved again
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Most recent 50 invitations
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a single-use shareable invitation valid for seven days
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '201':
          description: Invitation and its token, returned only once; never cache
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invite'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/households/{id}/invites/{inviteId}:
    delete:
      summary: Revoke an unused invitation as owner or admin
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invites/{token}:
    get:
      summary: Preview a valid invitation for the signed-in caller
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Household invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/InviteUnavailable'
  /v1/invites/{token}/accept:
    post:
      summary: Atomically redeem an invitation and join as a member
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Joined household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/InviteUnavailable'
  /v1/households/{id}/balances:
    get:
      summary: Read current member balances and informational transfer suggestions
      description: Positive net means owed to the member; negative net means they owe. Confirmed expenses and Paid bills count; Unpaid bills remain pending. Recorded manual settlements adjust balances. Suggestions never create transfers.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: API-calculated household balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/balances/{memberId}/entries:
    get:
      summary: Read the expenses, paid bills, and recorded transfers behind one member's balance
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: memberId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated balance sources, newest first
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/BalanceEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/settlements/preview:
    post:
      summary: Preview a manual transfer and its balance effect without saving
      description: Only an active sender or recipient may preview. The transfer occurred outside HouseMate and is not verified or processed here.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementDraft' }
      responses:
        '200':
          description: Current and projected balances with any warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/settlements:
    get:
      summary: List recorded manual transfers for an active member
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Recorded transfers, newest first
          content:
            application/json:
              schema:
                type: object
                required: [settlements]
                properties:
                  settlements:
                    type: array
                    items: { $ref: '#/components/schemas/Settlement' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Record a manual transfer idempotently
      description: Only the active sender or recipient may record it. A retry with the same UUID and draft returns the original record; a changed draft returns 409. HouseMate does not process or verify the transfer.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementCreate' }
      responses:
        '201':
          description: Recorded transfer or original result of retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/settlements/{settlementId}:
    get:
      summary: Read one recorded manual transfer
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: settlementId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recorded transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/bills/preview:
    post:
      summary: Preview a hybrid bill split without saving
      description: Any active member may preview. Positive charges are reserved from the bill, credits increase the base pool before being deducted from recipients. The API allocates all minor units exactly.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillDraft' }
      responses:
        '200':
          description: Authoritative bill breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/bills:
    get:
      summary: List confirmed bills for an active household member
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Confirmed bills, newest first
          content:
            application/json:
              schema:
                type: object
                required: [bills]
                properties:
                  bills:
                    type: array
                    items: { $ref: '#/components/schemas/Bill' }
    post:
      summary: Confirm a bill idempotently
      description: Any active member may create. The same UUID and draft returns the original bill; a changed draft returns 409. Confirmation recalculates shares and locks household currency.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillCreate' }
      responses:
        '201':
          description: Confirmed bill or original result of retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/bills/{billId}:
    get:
      summary: Get a confirmed bill
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bill detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Confirm a previously previewed bill edit
      description: The creator or a household owner/admin may edit. Requires an unexpired API preview for the exact draft and current revision. Provider payment status remains controlled by the status endpoint. The API recalculates shares transactionally, records before/after snapshots, and supports idempotent retries.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillEditConfirm' }
      responses:
        '200':
          description: Updated bill or original result of an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/bills/{billId}/edit-preview:
    post:
      summary: Preview a bill edit against the current revision
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillEditDraft' }
      responses:
        '200':
          description: Exact proposed shares and a ten-minute preview ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillEditPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/bills/{billId}/status:
    patch:
      summary: Record whether the provider has been paid
      description: Any active member may record a manual status change. Each change is audited. No payment is processed.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentStatus]
              properties:
                paymentStatus: { type: string, enum: [unpaid, paid] }
      responses:
        '200':
          description: Updated bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/bills/{billId}/void-preview:
    post:
      summary: Preview the balance effect of voiding a bill
      description: A paid bill is removed from member balances. An unpaid bill is removed from pending totals. Existing settlements remain recorded.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidDraft' }
      responses:
        '200':
          description: Proposed effect and a ten-minute preview ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/bills/{billId}/history:
    get:
      summary: Read a bill's creation, edits, provider status changes, and void history
      description: Any active member of the bill's household may read this history. Changed fields include human-readable old and new values. Events are newest first.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryOffset'
      responses:
        '200':
          description: Paginated bill history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialHistoryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/households/{id}/bills/{billId}/void:
    post:
      summary: Confirm a previously previewed bill void
      description: The creator or a household owner/admin may void. The bill remains visible and immutable with actor, time, and optional reason. Confirmation is idempotent.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidConfirm' }
      responses:
        '200':
          description: Voided bill or original result of an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/expenses/preview:
    post:
      summary: Calculate an expense split without saving it
      description: Any active household member may preview. The API validates active payer and participants and allocates integer minor units deterministically.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseDraft'
      responses:
        '200':
          description: Authoritative breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/households/{id}/expenses:
    get:
      summary: List confirmed expenses for an active household member
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Confirmed expenses, newest first
          content:
            application/json:
              schema:
                type: object
                required: [expenses]
                properties:
                  expenses:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Confirm a shared expense idempotently
      description: Any active member may create. Reusing the same UUID and draft returns the original expense; a different draft with that UUID returns 409. Confirmation recalculates the split and locks household currency in the same transaction.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Confirmed expense (or the original result of a retry)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/households/{id}/expenses/{expenseId}:
    get:
