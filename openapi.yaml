      description: The creator or a household owner/admin may edit. Requires an unexpired API preview for the exact draft and current revision. The API recalculates shares transactionally, records before/after snapshots, and supports idempotent retries.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: expenseId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseEditConfirm' }
      responses:
        '200':
          description: Updated expense or original result of an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/households/{id}/expenses/{expenseId}/edit-preview:
    post:
      summary: Preview an expense edit against the current revision
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - in: path
          name: expenseId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseEditDraft' }
      responses:
        '200':
